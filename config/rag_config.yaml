# MediShield AI: RAG Assistant Configuration
# IEEE CEEE 2026 Camera-Ready Specification

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  fallback_embedding: "tfidf_dense_svd"
  vector_store: "faiss_flat_cosine"
  chunk_size: 350
  chunk_overlap: 50
  top_k: 3
  similarity_threshold: 0.25

llm:
  provider: "local_extractive_grounded"  # Options: local_extractive_grounded, ollama, openai
  model: "grounded-evidence-synthesizer-v1"
  temperature: 0.0
  max_tokens: 512
  endpoint: null

privacy:
  disable_external_llm: true
  allow_external_transmission: false
  anonymize_phi: true
  store_chat_locally: true
  data_classification: "Healthcare Internal / Protected"

evaluation:
  benchmark_file: "results/rag_eval_for_human_rating.csv"
  metrics:
    - "retrieval_hit_rate"
    - "context_recall"
    - "groundedness_overlap"
    - "citation_precision"
